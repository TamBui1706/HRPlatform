openapi: 3.0.3
info:
  title: HR Platform Enterprise REST API
  description: Official OpenAPI 3.0 Specification for HR Platform Multi-Tenant Enterprise System.
  version: 1.0.0
servers:
  - url: https://api.hrplatform.enterprise.com/v1
    description: Production Gateway
  - url: http://localhost:5000/api/v1
    description: Local Development Mock Server

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - BearerAuth: []

paths:
  /health:
    get:
      summary: API Gateway Health Check
      description: Returns service status and component readiness.
      responses:
        '200':
          description: API Gateway is healthy
          content:
            application/json:
              example:
                status: "UP"
                timestamp: "2026-08-10T00:00:00Z"
